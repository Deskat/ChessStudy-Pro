name: Host Stockfish engine files for GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/host-stockfish.yml"

permissions:
  contents: write

jobs:
  download-and-publish-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download verified Stockfish 19.0.1 browser builds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p engine
          base="https://github.com/nmrugg/stockfish.js/releases/download/v19.0.1"

          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 \
            "$base/stockfish-19-lite-single.js" -o engine/stockfish-19-lite-single.js
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 \
            "$base/stockfish-19-lite-single.wasm" -o engine/stockfish-19-lite-single.wasm
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 \
            "$base/stockfish-19-single.js" -o engine/stockfish-19-single.js
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 \
            "$base/stockfish-19-single.wasm" -o engine/stockfish-19-single.wasm

          cat <<'EOF' | sha256sum --check -
          ccb130d7ff29408531c47d859a49f91d59d4f482d05a53eb1a3231a4f624c91a  engine/stockfish-19-lite-single.js
          ee4f115bdb2d32cadf96cada104a05b5ec257d7ad6f57582190b49bc71f096de  engine/stockfish-19-lite-single.wasm
          8071dee87312f74805a859de933e1a1ef465579ab1a51fbd597388cdce9d444d  engine/stockfish-19-single.js
          991bede2f253ebb08ff01fcc48270f4b9c8e66b12d5bd5f8d6f52eb3e3b3a740  engine/stockfish-19-single.wasm
          EOF

          test "$(wc -c < engine/stockfish-19-lite-single.wasm)" -eq 1845971
          test "$(wc -c < engine/stockfish-19-single.wasm)" -eq 99169054

      - name: Set up Node.js for engine smoke tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Smoke-test Lite and Full Stockfish with UCI
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const path = require("node:path");

          async function smokeTest(file) {
            const factory = require(path.resolve(file));
            if (typeof factory !== "function") {
              throw new Error(file + " did not export the Stockfish factory.");
            }

            await new Promise((resolve, reject) => {
              const engine = factory();
              let searched = false;
              let finished = false;
              const timer = setTimeout(() => finish(new Error(file + " timed out.")), 45000);

              function finish(error) {
                if (finished) return;
                finished = true;
                clearTimeout(timer);
                try { engine.processCommand("quit"); } catch (_) {}
                if (error) reject(error);
                else resolve();
              }

              engine.listener = (line) => {
                if (line === "uciok") {
                  engine.processCommand("isready");
                } else if (line === "readyok" && !searched) {
                  searched = true;
                  engine.processCommand("position startpos");
                  engine.processCommand("go depth 5");
                } else if (line.startsWith("bestmove ")) {
                  if (!/^bestmove [a-h][1-8][a-h][1-8][qrbn]?(?: |$)/.test(line)) {
                    finish(new Error(file + " returned an invalid bestmove: " + line));
                  } else {
                    console.log(file + " OK: " + line);
                    finish();
                  }
                }
              };

              engine.processCommand("uci");
            });
          }

          (async () => {
            await smokeTest("./engine/stockfish-19-lite-single.js");
            await smokeTest("./engine/stockfish-19-single.js");
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Build local screenshot-recognition assets
        shell: bash
        run: |
          set -euo pipefail
          build_dir="$(mktemp -d)"
          cd "$build_dir"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --save-exact \
            esbuild@0.25.12 @scoriiu/fenshot@0.1.5 onnxruntime-web@1.26.0

          out="$GITHUB_WORKSPACE/recognition"
          mkdir -p "$out"
          ./node_modules/.bin/esbuild node_modules/@scoriiu/fenshot/dist/index.js \
            --bundle --format=esm --platform=browser --target=es2022 \
            --outfile="$out/fenshot.bundle.js"

          cp node_modules/@scoriiu/fenshot/model/chess-tiles-v2.onnx "$out/"
          cp node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.mjs "$out/"
          cp node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.wasm "$out/"

          test "$(wc -c < "$out/chess-tiles-v2.onnx")" -eq 1289483
          test -s "$out/fenshot.bundle.js"
          test -s "$out/ort-wasm-simd-threaded.mjs"
          test -s "$out/ort-wasm-simd-threaded.wasm"
          ls -lh "$out/"

      - name: Commit engine and recognition assets to the Pages source branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/ recognition/
          if git diff --cached --quiet; then
            echo "Engine and recognition assets are already up to date."
            exit 0
          fi
          git commit -m "Add locally hosted Stockfish and screenshot recognition"

          # Keep the push safe if the app files are updated while this job
          # downloads and builds the binary assets.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
