name: Host Stockfish engine files for GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/host-stockfish.yml"

permissions:
  contents: write

jobs:
  download-and-publish-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download verified Stockfish 19.0.1 browser builds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p engine
          base="https://github.com/nmrugg/stockfish.js/releases/download/v19.0.1"

          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 \
            "$base/stockfish-19-lite-single.js" -o engine/stockfish-19-lite-single.js
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 \
            "$base/stockfish-19-lite-single.wasm" -o engine/stockfish-19-lite-single.wasm
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 \
            "$base/stockfish-19-single.js" -o engine/stockfish-19-single.js
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 \
            "$base/stockfish-19-single.wasm" -o engine/stockfish-19-single.wasm

          cat <<'EOF' | sha256sum --check -
          ccb130d7ff29408531c47d859a49f91d59d4f482d05a53eb1a3231a4f624c91a  engine/stockfish-19-lite-single.js
          ee4f115bdb2d32cadf96cada104a05b5ec257d7ad6f57582190b49bc71f096de  engine/stockfish-19-lite-single.wasm
          8071dee87312f74805a859de933e1a1ef465579ab1a51fbd597388cdce9d444d  engine/stockfish-19-single.js
          991bede2f253ebb08ff01fcc48270f4b9c8e66b12d5bd5f8d6f52eb3e3b3a740  engine/stockfish-19-single.wasm
          EOF

          test "$(wc -c < engine/stockfish-19-lite-single.wasm)" -eq 1845971
          test "$(wc -c < engine/stockfish-19-single.wasm)" -eq 99169054

      - name: Commit engine files to the Pages source branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/
          if git diff --cached --quiet; then
            echo "Stockfish engine files are already up to date."
            exit 0
          fi
          git commit -m "Add locally hosted Stockfish 19 engine files"
          git push origin HEAD:main
