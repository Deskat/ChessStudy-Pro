name: Build ChessStudy Pro for Windows

on:
  push:
    branches:
      - main
    paths:
      - "desktop/**"
      - "pc.html"
      - ".github/workflows/build-windows-pc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download official Stockfish 19 for Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "stockfish-19-windows.zip"
          $extract = Join-Path $env:RUNNER_TEMP "stockfish-19"
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          Invoke-WebRequest `
            -Uri "https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-windows-x86-64-universal.zip" `
            -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          $target = Join-Path $env:GITHUB_WORKSPACE "desktop/stockfish"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          $engine = Get-ChildItem -Path $extract -Recurse -File -Filter "*.exe" | Select-Object -First 1
          if (-not $engine) { throw "Stockfish executable was not found in the official archive." }
          Copy-Item -Path $engine.FullName -Destination (Join-Path $target "stockfish.exe") -Force
          Get-ChildItem -Path $extract -Recurse -File -Include "*.nnue" | ForEach-Object { Copy-Item -Path $_.FullName -Destination $target -Force }
          if (-not (Test-Path (Join-Path $target "stockfish.exe"))) { throw "Stockfish engine copy failed." }
          Get-ChildItem -Path $target -Recurse | Select-Object FullName,Length

      - name: Prepare app icon
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pillow
          $iconPng = Join-Path $env:GITHUB_WORKSPACE "icons/icon-512.png"
          $iconIco = Join-Path $env:GITHUB_WORKSPACE "desktop/src-tauri/icons/icon.ico"
          New-Item -ItemType Directory -Force -Path (Split-Path $iconIco) | Out-Null
          python -c "from PIL import Image; im=Image.open(r'$iconPng').convert('RGBA'); im.save(r'$iconIco',format='ICO',sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Install Tauri CLI
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Prepare desktop frontend
        working-directory: desktop
        run: npm run prepare

      - name: Build native Windows installer
        working-directory: desktop
        run: npm run tauri:build

      - name: Verify installer exists
        shell: pwsh
        run: |
          $installer = Get-ChildItem "desktop/src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced." }
          Get-Item $installer.FullName | Select-Object FullName,Length

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ChessStudy-Pro-Windows-Installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
